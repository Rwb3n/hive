# The building, as a stack.
#
# Two long-lived services (control plane + telemetry) and N short-lived agent containers
# that the runner starts per task. Agents are NOT declared here: the runner creates them
# with `docker run` from agent.yaml, because their count and lifetime are dynamic.
#
# Network design is part of the boundary: agents sit on `hive-net` and can reach the api
# and the collector by name. `internal: true` on that network means no route to the
# internet or the host LAN — a containerised agent can talk to the hive and to the
# Anthropic API (via the egress alias below) and nothing else.

name: hive

services:
  api:
    image: node:22-bookworm-slim
    working_dir: /hive
    command: node api/server.js
    environment:
      HIVE_HOME: /hive
      HIVE_HOST: 0.0.0.0          # reachable from agent containers
      HIVE_PORT: "8787"
      HIVE_TOKEN: ${HIVE_TOKEN:-}
    volumes:
      - ${HIVE_HOME:-../}:/hive
    ports:
      - "127.0.0.1:8787:8787"     # loopback only on the host
    networks: [hive-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8787/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

  collector:
    image: node:22-bookworm-slim
    working_dir: /hive
    command: node api/collector.js
    environment:
      HIVE_HOME: /hive
      HIVE_OTLP_HOST: 0.0.0.0
      HIVE_OTLP_PORT: "4318"
    volumes:
      - ${HIVE_HOME:-../}:/hive
    ports:
      - "127.0.0.1:4318:4318"
    networks: [hive-net]
    restart: unless-stopped

  # Optional: Prometheus + Grafana for history. The collector writes cost straight into
  # hive.db (which is what `hive cost` reads), so this is only for dashboards over time.
  # Enable with: docker compose --profile dashboards up -d
  prometheus:
    image: prom/prometheus:latest
    profiles: [dashboards]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [hive-net]

  grafana:
    image: grafana/grafana:latest
    profiles: [dashboards]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [hive-net]
    depends_on: [prometheus]

networks:
  hive-net:
    driver: bridge
    # NOTE: not `internal: true` yet — agents need egress to api.anthropic.com to work at
    # all. Restricting egress to just that host needs an explicit proxy (or an internal
    # network plus a squid/allowlist sidecar). Until then a containerised agent HAS
    # internet access; the filesystem is contained, the network is not.

volumes:
  prom-data:
  grafana-data:
